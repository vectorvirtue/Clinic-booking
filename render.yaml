services:
  - type: web
    name: wellnest-clinic
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: API_KEY
        sync: false
      - key: VITE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VITE_API_BASE_URL
        value: ""
